<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adventures - Memory Match</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #memory-board { display: grid; grid-template-columns: repeat(4, 100px); gap: 10px; margin: 20px auto; justify-content: center; }
        .card { width: 100px; height: 100px; background: #ccc; border-radius: 10px; cursor: pointer; transition: transform 0.3s; }
        .card.flipped { transform: rotateY(180deg); background: #fff; }
        .card.matched { background: #4CAF50; }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="memory.html">Memory Match</a></li>
                <li><a href="tictactoe.html">Tic-Tac-Toe</a></li>
                <li><a href="snake.html">Snake Game</a></li>
                <li><a href="quiz.html">Animal Quiz</a></li>
            </ul>
        </nav>
    </header>
    <main class="game-container">
        <h1>Memory Match</h1>
        <p>Flip cards to find matching animals!</p>
        <div id="memory-board"></div>
        <button id="reset">Reset Game</button>
    </main>
    <footer>&copy; 2026 Animal Adventures</footer>
    <script>
        const animals = ['🦁', '🦁', '🐵', '🐵', '🐘', '🐘', '🦒', '🦒', '🦊', '🦊', '🐯', '🐯', '🐼', '🐼', '🦄', '🦄'];
        let shuffled = animals.sort(() => 0.5 - Math.random());
        const board = document.getElementById('memory-board');
        let flippedCards = [];
        let matched = 0;

        function createBoard() {
            board.innerHTML = '';
            shuffled.forEach((animal, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.animal = animal;
                card.dataset.index = index;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                this.textContent = this.dataset.animal;
                flippedCards.push(this);
                if (flippedCards.length === 2) {
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.animal === card2.dataset.animal) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matched += 2;
                if (matched === animals.length) alert('You won!');
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.textContent = '';
                    card2.textContent = '';
                }, 1000);
            }
            flippedCards = [];
        }

        document.getElementById('reset').addEventListener('click', () => {
            shuffled = animals.sort(() => 0.5 - Math.random());
            matched = 0;
            createBoard();
        });

        createBoard();
    </script>
</body>
</html>
