<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adventures - Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #board { 
            display: grid; 
            grid-template-columns: repeat(3, 120px); 
            gap: 10px; 
            margin: 30px auto; 
            justify-content: center; 
        }
        .cell { 
            width: 120px; 
            height: 120px; 
            background: #fff; 
            border: 4px solid #FF4500; 
            border-radius: 15px;
            font-size: 60px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.3s, transform 0.2s; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .cell:hover { 
            background: #fffacd; 
            transform: scale(1.05);
        }
        #mode-selection { 
            margin: 30px auto; 
            text-align: center; 
        }
        #mode-selection button { 
            margin: 15px; 
            padding: 15px 30px; 
            font-size: 18px; 
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #mode-selection button:hover {
            background: #45a049;
            transform: translateY(-3px);
        }
        .hero-pic {
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin: 20px auto;
            display: block;
            transition: transform 0.5s;
        }
        .hero-pic:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="memory.html">Memory Match</a></li>
                <li><a href="tictactoe.html">Tic-Tac-Toe</a></li>
                <li><a href="snake.html">Snake Game</a></li>
                <li><a href="quiz.html">Animal Quiz</a></li>
            </ul>
        </nav>
    </header>
    <main class="game-container">
        <h1>Tic-Tac-Toe: Lion vs Monkey 🦁🆚🐵</h1>
        <p>Player 1: 🦁 Lion | Player 2: 🐵 Monkey</p>

        <!-- Cute Picture Added Here -->
        <img src="https://thumbs.dreamstime.com/b/happy-jungle-animals-elephant-lion-monkey-friends-vector-design-generative-ai-delightful-illustration-featuring-gathered-391022211.jpg" alt="Cute cartoon lion and monkey friends with other jungle animals" class="hero-pic">
        
        <div id="mode-selection">
            <h2>Choose Game Mode 🎮</h2>
            <button id="two-players">Play with Friend 👥</button>
            <button id="vs-computer">Play vs Clever Monkey 🐵</button>
        </div>

        <div id="board" style="display: none;"></div>
        <p id="status" style="display: none; font-size: 1.5em; font-weight: bold;"></p>
        <button id="reset" style="display: none; padding: 12px 24px; font-size: 18px;">Reset Game 🔄</button>
    </main>
    <footer>&copy; 2026 Animal Adventures</footer>
    <script>
        const boardEl = document.getElementById('board');
        const status = document.getElementById('status');
        const reset = document.getElementById('reset');
        const twoPlayersBtn = document.getElementById('two-players');
        const vsComputerBtn = document.getElementById('vs-computer');
        const modeSelection = document.getElementById('mode-selection');

        let gameBoard = Array(9).fill(null);
        let currentPlayer = '🦁';
        let isComputerMode = false;
        const humanPlayer = '🦁';
        const aiPlayer = '🐵';
        const winConditions = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function createBoard() {
            boardEl.innerHTML = '';
            gameBoard.forEach((_, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.addEventListener('click', () => handleClick(index));
                boardEl.appendChild(cell);
            });
        }

        function handleClick(index) {
            if (gameBoard[index] || checkWin() || gameBoard.every(cell => cell)) return;

            makeMove(index, currentPlayer);

            if (checkWin()) {
                status.textContent = `${currentPlayer === '🦁' ? 'Lion' : 'Monkey'} wins! 🎉`;
                endGame();
            } else if (gameBoard.every(cell => cell)) {
                status.textContent = 'It\'s a Draw! 🤝';
                endGame();
            } else {
                currentPlayer = currentPlayer === '🦁' ? '🐵' : '🦁';
                status.textContent = `${currentPlayer === '🦁' ? 'Lion' : 'Monkey'}'s turn`;

                if (isComputerMode && currentPlayer === aiPlayer) {
                    setTimeout(aiMove, 800); // Small delay for fun
                }
            }
        }

        function makeMove(index, player) {
            gameBoard[index] = player;
            boardEl.children[index].textContent = player;
        }

        function checkWin() {
            return winConditions.some(condition => condition.every(i => gameBoard[i] === currentPlayer));
        }

        function endGame() {
            Array.from(boardEl.children).forEach(cell => cell.removeEventListener('click', handleClick));
        }

        // AI Agent using Minimax (unbeatable Monkey!)
        function aiMove() {
            let bestScore = -Infinity;
            let bestMove;
            for (let i = 0; i < 9; i++) {
                if (!gameBoard[i]) {
                    gameBoard[i] = aiPlayer;
                    let score = minimax(gameBoard, 0, false);
                    gameBoard[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            handleClick(bestMove);
        }

        function minimax(board, depth, isMaximizing) {
            if (checkWinner(aiPlayer, board)) return 10 - depth;
            if (checkWinner(humanPlayer, board)) return depth - 10;
            if (board.every(cell => cell)) return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (!board[i]) {
                        board[i] = aiPlayer;
                        let eval = minimax(board, depth + 1, false);
                        board[i] = null;
                        maxEval = Math.max(maxEval, eval);
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (!board[i]) {
                        board[i] = humanPlayer;
                        let eval = minimax(board, depth + 1, true);
                        board[i] = null;
                        minEval = Math.min(minEval, eval);
                    }
                }
                return minEval;
            }
        }

        function checkWinner(player, board) {
            return winConditions.some(condition => condition.every(i => board[i] === player));
        }

        // Mode selection
        twoPlayersBtn.addEventListener('click', () => startGame(false));
        vsComputerBtn.addEventListener('click', () => startGame(true));

        function startGame(computerMode) {
            isComputerMode = computerMode;
            modeSelection.style.display = 'none';
            boardEl.style.display = 'grid';
            status.style.display = 'block';
            reset.style.display = 'block';
            resetGame();
        }

        reset.addEventListener('click', resetGame);

        function resetGame() {
            gameBoard = Array(9).fill(null);
            currentPlayer = '🦁';
            status.textContent = 'Lion\'s turn 🦁';
            createBoard();
            if (isComputerMode && currentPlayer === aiPlayer) {
                aiMove();
            }
        }
    </script>
</body>
</html>
